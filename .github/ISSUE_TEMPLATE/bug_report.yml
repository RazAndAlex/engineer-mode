name: Bug report
description: The interview or the build did something it should not.
labels: [bug]
body:
  - type: textarea
    id: typed
    attributes:
      label: What you typed
      placeholder: /engineer-mode:interview ...
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What Claude did
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
