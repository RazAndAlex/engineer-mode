<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4b2ab"/></marker></defs>
<rect width="860" height="320" rx="12" fill="#26262a"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#ecebe7">How engineer mode runs</text>
<rect x="24" y="96" width="230" height="118" rx="10" fill="#2f2f34" stroke="#e0b064" stroke-width="1.5"/><text x="40" y="126" font-weight="700" fill="#e0b064">You</text><text x="40" y="150" font-size="17" font-weight="600" fill="#ecebe7">give your approach</text><text x="40" y="176" font-size="14" fill="#b4b2ab">to one concrete situation</text><text x="40" y="196" font-size="14" fill="#b4b2ab">no options shown yet</text><rect x="297" y="96" width="230" height="118" rx="10" fill="#2f2f34" stroke="#9db4d8" stroke-width="1.5"/><text x="313" y="126" font-weight="700" fill="#9db4d8">Claude</text><text x="313" y="150" font-size="17" font-weight="600" fill="#ecebe7">checks it</text><text x="313" y="176" font-size="14" fill="#b4b2ab">what holds up</text><text x="313" y="196" font-size="14" fill="#b4b2ab">3 risks and 2 options at most</text><rect x="570" y="96" width="230" height="118" rx="10" fill="#2f2f34" stroke="#e0b064" stroke-width="1.5"/><text x="586" y="126" font-weight="700" fill="#e0b064">You</text><text x="586" y="150" font-size="17" font-weight="600" fill="#ecebe7">decide</text><text x="586" y="176" font-size="14" fill="#b4b2ab">or revise once</text><text x="586" y="196" font-size="14" fill="#b4b2ab">or say “recommend”</text><path d="M258 155.0H291" stroke="#b4b2ab" stroke-width="1.5" marker-end="url(#ar)"/><path d="M531 155.0H564" stroke="#b4b2ab" stroke-width="1.5" marker-end="url(#ar)"/><path d="M685.0 96 V74 H139.0 V90" fill="none" stroke="#b4b2ab" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="412.0" y="66" font-size="14" fill="#b4b2ab" text-anchor="middle">next call: scope, data model, who can reach what (always yours)</text><path d="M685.0 218 V250" stroke="#b4b2ab" stroke-width="1.5" marker-end="url(#ar)"/><rect x="297" y="254" width="503" height="40" rx="8" fill="#2f2f34" stroke="#8fc79a" stroke-width="1.5"/><text x="313" y="279"><tspan font-weight="700" fill="#8fc79a">On file </tspan><tspan class="m" fill="#ecebe7">docs/decisions/0002-full-runs.md</tspan></text><path d="M297 274 H260" stroke="#b4b2ab" stroke-width="1.5" marker-end="url(#ar)"/><rect x="24" y="254" width="230" height="40" rx="8" fill="#2f2f34" stroke="#ecebe7" stroke-width="1.5"/><text x="40" y="279"><tspan font-weight="700" fill="#ecebe7">Build</tspan><tspan fill="#b4b2ab" font-size="14"> · all calls decided</tspan></text>
</svg>