<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="Engineer mode loop: you give your approach, Claude checks it, you decide; each decision is written to a file; when every call is decided Claude builds">
