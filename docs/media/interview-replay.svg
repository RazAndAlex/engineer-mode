<text x="24" y="38" font-size="16" font-weight="700" fill="#ecebe7">One call in engineer mode</text>
<text x="836" y="38" font-size="14" fill="#b4b2ab" text-anchor="end">you decide · Claude builds</text>
<rect x="24" y="62" width="154" height="4" rx="2" fill="#4a4a52" style="animation:s0 22.0s infinite step-end"/><text x="24" y="88" font-size="14" font-weight="600" fill="#b4b2ab" style="animation:st0 22.0s infinite step-end">1 · Map the calls</text><rect x="186" y="62" width="154" height="4" rx="2" fill="#4a4a52" style="animation:s1 22.0s infinite step-end"/><text x="186" y="88" font-size="14" font-weight="600" fill="#b4b2ab" style="animation:st1 22.0s infinite step-end">2 · You answer first</text><rect x="349" y="62" width="154" height="4" rx="2" fill="#4a4a52" style="animation:s2 22.0s infinite step-end"/><text x="349" y="88" font-size="14" font-weight="600" fill="#b4b2ab" style="animation:st2 22.0s infinite step-end">3 · Claude adds</text><rect x="511" y="62" width="154" height="4" rx="2" fill="#4a4a52" style="animation:s3 22.0s infinite step-end"/><text x="511" y="88" font-size="14" font-weight="600" fill="#b4b2ab" style="animation:st3 22.0s infinite step-end">4 · On file</text><rect x="674" y="62" width="154" height="4" rx="2" fill="#4a4a52" style="animation:s4 22.0s infinite step-end"/><text x="674" y="88" font-size="14" font-weight="600" fill="#b4b2ab" style="animation:st4 22.0s infinite step-end">5 · Build</text><g style="opacity:0;animation:l0 22.0s infinite"><text x="24" y="118" font-weight="700" fill="#e0b064">You</text><text x="104" y="118"><tspan class="m" fill="#8fc79a">/engineer-mode:interview</tspan><tspan fill="#ecebe7"> a sign-up page for Saturday runs</tspan></text></g><g style="opacity:0;animation:l1 22.0s infinite"><text x="24" y="152" font-weight="700" fill="#9db4d8">Claude</text><text x="104" y="152"><tspan fill="#ecebe7">Calls for you: who gets the last place, who can reach what.</tspan></text></g><g style="opacity:0;animation:l2 22.0s infinite"><text x="24" y="186" font-weight="700" fill="#9db4d8">Claude</text><text x="104" y="186"><tspan fill="#ecebe7">Two people take the last place at the same moment. What happens?</tspan></text></g><g style="opacity:0;animation:l3 22.0s infinite"><text x="24" y="220" font-weight="700" fill="#e0b064">You</text><text x="104" y="220"><tspan fill="#ecebe7">First one wins.</tspan></text></g><g style="opacity:0;animation:l4 22.0s infinite"><text x="24" y="254" font-weight="700" fill="#9db4d8">Claude</text><text x="104" y="254"><tspan fill="#ecebe7">Holds up. Risk: a cancel leaves a gap nobody fills.</tspan></text></g><g style="opacity:0;animation:l5 22.0s infinite"><text x="24" y="288" font-weight="700" fill="#9db4d8">Claude</text><text x="104" y="288"><tspan fill="#ecebe7">Option you did not name: a waiting list.</tspan></text></g><g style="opacity:0;animation:l6 22.0s infinite"><text x="24" y="322" font-weight="700" fill="#e0b064">You</text><text x="104" y="322"><tspan fill="#ecebe7">Waiting list.</tspan></text></g><g style="opacity:0;animation:l7 22.0s infinite"><text x="24" y="356" font-weight="700" fill="#9db4d8">Claude</text><text x="104" y="356"><tspan fill="#ecebe7">Wrote </tspan><tspan class="m" fill="#8fc79a">docs/decisions/0002-full-runs.md</tspan></text></g><g style="opacity:0;animation:l8 22.0s infinite"><text x="24" y="390" font-weight="700" fill="#9db4d8">Claude</text><text x="104" y="390"><tspan fill="#ecebe7">Built it, started it once. 0 parts marked “not checked”.</tspan></text></g>
</svg>